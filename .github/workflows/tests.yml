name: Test Suites
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Legacy tests
        run: node --test $(find test -name '*.test.js')
      - name: Vitest tests
        run: npx vitest run